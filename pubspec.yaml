name: pigment_km
description: >-
  Measured-pigment, two-constant Kubelka–Munk colour mixing for Dart — forward
  (paints + parts → colour) and inverse (target colour → best recipes by ΔE00),
  behind a swappable MixingEngine interface.
version: 0.0.1

# Not yet published to pub.dev (see README "Status"). Remove `publish_to` when the
# first behaviour phases land and the public API is ready for a release.
publish_to: none

environment:
  sdk: ^3.4.0

dev_dependencies:
  test: ^1.25.0
  coverage: ^1.9.0
  lints: ^4.0.0
