# Static analysis for pigment_km.
# Starts from the community-recommended lint set and adds a few rules that keep a
# measured-data colour-science library honest and readable.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat these as errors so the scaffold's `dart analyze` gate stays clean.
    unused_import: error
    unused_local_variable: error
    dead_code: error

linter:
  rules:
    - avoid_print
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - directives_ordering
    - omit_local_variable_types
